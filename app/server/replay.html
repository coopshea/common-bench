<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Replay · Common Bench</title>
<style>
  /* The same faces and colours as Common Bench (src/ds/tokens.css). The fonts come from the app's own packages. */
  @font-face { font-family: "Instrument Sans"; font-weight: 400; src: url("/node_modules/@fontsource/instrument-sans/files/instrument-sans-latin-400-normal.woff2") format("woff2"); }
  @font-face { font-family: "Instrument Sans"; font-weight: 500; src: url("/node_modules/@fontsource/instrument-sans/files/instrument-sans-latin-500-normal.woff2") format("woff2"); }
  @font-face { font-family: "Instrument Sans"; font-weight: 600; src: url("/node_modules/@fontsource/instrument-sans/files/instrument-sans-latin-600-normal.woff2") format("woff2"); }
  @font-face { font-family: "IBM Plex Mono"; font-weight: 400; src: url("/node_modules/@fontsource/ibm-plex-mono/files/ibm-plex-mono-latin-400-normal.woff2") format("woff2"); }
  :root {
    --canvas: #f5f4ef; --panel: #fbfaf7; --line: #d6d2c8; --line-2: #e6e3db;
    --ink: #1b1a17; --ink-2: #47443d; --ink-3: #69655c; --ink-4: #8a857b;
    --sel: #13808f; --sel-tint: #e6f3f4; --good: #0ca30c; --amber-ink: #8a5800;
    --sans: "Instrument Sans", system-ui, -apple-system, sans-serif; --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--canvas); color: var(--ink); font-family: var(--sans); font-size: 16px; display: flex; flex-direction: column; overflow: hidden; }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
  .mono { font-family: var(--mono); }

  header { display: flex; align-items: baseline; gap: 16px; padding: 18px 28px 14px; border-bottom: 1px solid var(--line); }
  header h1 { margin: 0; font-size: 24px; font-weight: 600; letter-spacing: -0.01em; }
  header h1 span { color: var(--ink-4); font-weight: 500; }
  header .when { font-family: var(--mono); font-size: 12.5px; color: var(--ink-3); margin-left: auto; }

  main { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(340px, 1fr); }
  .stage { display: flex; flex-direction: column; min-height: 0; padding: 20px 24px 16px 28px; gap: 14px; border-right: 1px solid var(--line); }
  .screen { flex: none; width: 100%; aspect-ratio: 16 / 9; max-height: calc(100vh - 215px); display: flex; align-items: center; justify-content: center; background: var(--ink); border-radius: 6px; overflow: hidden; position: relative; }
  .screen video { width: 100%; height: 100%; object-fit: contain; display: block; background: var(--ink); }
  .screen .tag { position: absolute; left: 12px; top: 12px; font-family: var(--mono); font-size: 11.5px; letter-spacing: 0.02em; color: #f5f4ef; background: rgba(27, 26, 23, .55); padding: 3px 7px; border-radius: 3px; }

  .bar { display: flex; align-items: center; gap: 14px; }
  .play { width: 44px; height: 44px; flex: none; border-radius: 50%; border: 1px solid var(--ink); display: inline-flex; align-items: center; justify-content: center; }
  .play:hover { background: #fff; }
  .clock { font-family: var(--mono); font-size: 15px; min-width: 92px; }
  .track { position: relative; flex: 1; height: 34px; cursor: pointer; }
  .track::before { content: ""; position: absolute; left: 0; right: 0; top: 16px; height: 1px; background: var(--ink-4); }
  .tick { position: absolute; top: 11px; width: 7px; height: 11px; margin-left: -3px; }
  .tick.camera { background: var(--ink); }
  .tick.voice { top: 13px; height: 7px; border-radius: 50%; background: var(--panel); border: 1px solid var(--ink-2); }
  .tick.reply { top: 13px; height: 7px; border-radius: 50%; background: var(--sel); }
  .tick.value { top: 3px; width: 1px; height: 27px; margin-left: 0; background: var(--good); }
  .head { position: absolute; top: 0; bottom: 0; width: 2px; margin-left: -1px; background: var(--sel); pointer-events: none; }
  .key { display: flex; gap: 18px; font-family: var(--mono); font-size: 11.5px; color: var(--ink-3); }
  .key span { display: inline-flex; align-items: center; gap: 7px; }
  .key i.tick { position: static; margin: 0; flex: none; }
  .key i.tick.value { height: 13px; }

  aside { display: flex; flex-direction: column; min-height: 0; }
  .steps { list-style: none; margin: 0; padding: 14px 24px 12px; border-bottom: 1px solid var(--line); display: flex; flex-direction: column; }
  .step { display: grid; grid-template-columns: 22px 1fr auto auto; align-items: baseline; gap: 10px; padding: 7px 0 7px 10px; border-left: 3px solid transparent; color: var(--ink-4); }
  .step + .step { border-top: 1px solid var(--line-2); }
  .step.now { border-left-color: var(--sel); color: var(--ink); }
  .step.done { color: var(--ink); }
  .step .n { font-family: var(--mono); font-size: 12.5px; }
  .step.done .n { color: var(--good); }
  .step .t { font-size: 16.5px; font-weight: 500; }
  .step .target { font-family: var(--mono); font-size: 12.5px; color: var(--ink-3); }
  .step .target s { color: var(--ink-4); margin-right: 6px; }
  .step .val { font-family: var(--mono); font-size: 17px; font-weight: 500; min-width: 92px; text-align: right; }
  .step .val small { font-size: 11.5px; font-weight: 400; color: var(--amber-ink); margin-left: 6px; }
  .step .val.fresh { animation: land 1.1s ease-out; }
  @keyframes land { 0% { background: var(--sel-tint); box-shadow: 0 0 0 6px var(--sel-tint); } 100% { background: transparent; box-shadow: 0 0 0 6px transparent; } }

  .feed { list-style: none; margin: 0; padding: 14px 24px 18px; flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 9px;
    -webkit-mask-image: linear-gradient(to bottom, transparent 0, #000 22px); mask-image: linear-gradient(to bottom, transparent 0, #000 22px); }
  .line { display: grid; grid-template-columns: 62px 1fr; gap: 10px; align-items: start; text-align: left; width: 100%; color: var(--ink-3); }
  .line:hover .at { color: var(--sel); }
  .line .at { font-family: var(--mono); font-size: 11.5px; padding-top: 3px; color: var(--ink-4); }
  .line .body { font-size: 15.5px; line-height: 1.35; }
  .line.latest { color: var(--ink); }
  .line.voice .body { font-style: normal; }
  .line.reply .body { color: var(--sel); }
  .line.camera .body { display: grid; grid-template-columns: 76px 1fr; gap: 10px; align-items: center; }
  .line.camera img { width: 76px; aspect-ratio: 16 / 9; object-fit: cover; border-radius: 3px; border: 1px solid var(--line); display: block; }
  .line .src { display: block; font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.02em; color: var(--ink-4); margin-bottom: 1px; }
  .empty { margin: auto; color: var(--ink-3); font-size: 15px; }

  /* ---- Overlay (?overlay): the record drawn on the footage itself, for a video. Sizes follow the picture (cqw). ---- */
  body.overlay header, body.overlay aside, body.overlay .bar, body.overlay .key, body.overlay .tag { display: none; }
  body.overlay { background: #000; }
  body.overlay main { grid-template-columns: 1fr; }
  body.overlay .stage { padding: 0; border: 0; }
  body.overlay .screen { height: 100vh; max-height: none; aspect-ratio: auto; border-radius: 0; background: #000; }
  .ov { display: none; }
  body.overlay .ov { display: block; position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(100vw, calc(100vh * 16 / 9)); aspect-ratio: 16 / 9;
    container-type: inline-size; pointer-events: none; color: #f5f4ef; --scrim: rgba(20, 19, 17, .78); --dim: rgba(245, 244, 239, .62); --cy: #7fd6e0; --amber: #ffc861; }
  .ov .tri { width: .95cqw; height: .85cqw; vertical-align: -.05cqw; margin-right: .35cqw; }
  .ov-top { position: absolute; left: 2cqw; top: 2cqw; display: flex; flex-direction: column; gap: .5cqw; align-items: flex-start; }
  .ov-top .what { background: var(--scrim); padding: .5cqw .9cqw; border-radius: .3cqw; font-size: 1.35cqw; font-weight: 500; }
  .ov-top .what b { font-family: var(--mono); font-weight: 400; margin-left: .9cqw; color: var(--dim); }
  .ov-top .seen { background: var(--scrim); padding: .35cqw .9cqw; border-radius: .3cqw; font-size: 1.05cqw; color: var(--dim); max-width: 34cqw; }
  .ov-top .seen i { font-family: var(--mono); font-style: normal; font-size: .85cqw; margin-right: .6cqw; }
  .ov-rec { position: absolute; right: 2cqw; top: 2cqw; width: 27cqw; background: var(--scrim); border-radius: .4cqw; padding: .5cqw 1.1cqw .6cqw; }
  .ov-rec .r { display: grid; grid-template-columns: 1.6cqw 1fr auto; column-gap: .6cqw; align-items: baseline; padding: .5cqw 0; color: var(--dim); font-size: 1.3cqw; }
  .ov-rec .r + .r { border-top: 1px solid rgba(245, 244, 239, .16); }
  .ov-rec .r .n { font-family: var(--mono); font-size: 1cqw; }
  .ov-rec .r .v { font-family: var(--mono); font-size: 1.3cqw; text-align: right; }
  .ov-rec .r .d { grid-column: 2 / 4; font-family: var(--mono); font-size: .95cqw; color: var(--amber); text-align: right; }
  .ov-rec .r.done { color: #f5f4ef; }
  .ov-rec .r.done .n { color: #6fdc6f; }
  .ov-rec .r.now { color: #f5f4ef; }
  .ov-rec .r.now .n { color: var(--cy); }
  .ov-rec .r.now .v { color: var(--cy); }
  .ov-rec .r.fresh { animation: ovland 1.4s ease-out; }
  @keyframes ovland { 0% { background: rgba(127, 214, 224, .35); box-shadow: 0 0 0 .5cqw rgba(127, 214, 224, .35); } 100% { background: transparent; box-shadow: 0 0 0 .5cqw transparent; } }
  .ov-hero { position: absolute; left: 2cqw; bottom: 2.2cqw; max-width: 46cqw; background: var(--scrim); border-radius: .4cqw; padding: 1cqw 1.4cqw 1.1cqw; }
  .ov-hero .k { font-family: var(--mono); font-size: 1cqw; color: var(--dim); letter-spacing: .02em; }
  .ov-hero .big { font-size: 3.6cqw; font-weight: 600; letter-spacing: -.01em; line-height: 1.1; }
  .ov-hero .big span { font-family: var(--mono); font-weight: 500; }
  .ov-hero .big small { font-size: 1.5cqw; font-weight: 500; margin-left: .9cqw; color: var(--dim); }
  .ov-hero .sub { font-family: var(--mono); font-size: 1.15cqw; margin-top: .2cqw; color: var(--dim); }
  .ov-hero .sub.off { color: var(--amber); }
  .ov-hero .said { font-size: 1.25cqw; color: var(--dim); margin-bottom: .5cqw; }
  .ov-card { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(20, 19, 17, .55); animation: ovin .5s ease-out; }
  @keyframes ovin { from { opacity: 0; } to { opacity: 1; } }
  .ov-card .in { width: 56cqw; background: rgba(20, 19, 17, .9); border-radius: .5cqw; padding: 2.2cqw 2.6cqw 2cqw; }
  .ov-card .k { font-family: var(--mono); font-size: 1cqw; color: var(--dim); }
  .ov-card h2 { margin: .4cqw 0 1.5cqw; font-size: 2.9cqw; font-weight: 600; letter-spacing: -.01em; line-height: 1.15; }
  .ov-card table { width: 100%; border-collapse: collapse; font-size: 1.3cqw; }
  .ov-card th { font-family: var(--mono); font-size: .95cqw; font-weight: 400; color: var(--dim); text-align: right; padding: 0 0 .5cqw; }
  .ov-card th:first-child, .ov-card td:first-child { text-align: left; }
  .ov-card td { padding: .55cqw 0; border-top: 1px solid rgba(245, 244, 239, .16); text-align: right; font-family: var(--mono); }
  .ov-card td:first-child { font-family: var(--sans); font-weight: 500; }
  .ov-card tr.off td { color: var(--amber); }
  .ov-card tr.off td:first-child { color: #f5f4ef; }
  .ov-card tfoot td { color: var(--dim); }
  .ov-card .res { display: flex; gap: 3cqw; margin: -.3cqw 0 1.4cqw; }
  .ov-card .res b { display: block; font-family: var(--mono); font-size: 2.6cqw; font-weight: 500; color: var(--cy); }
  .ov-card .res span { font-size: 1.1cqw; color: var(--dim); }
  .ov-card .notes { margin-top: 1.2cqw; font-size: 1.2cqw; }
  .ov-card .notes p { margin: .3cqw 0 0; }
  .ov-card .notes i { font-family: var(--mono); font-style: normal; font-size: .95cqw; color: var(--dim); margin-right: .8cqw; }
  .ov-top .what.timer { color: var(--cy); font-family: var(--mono); font-weight: 400; }
  .ov-top .what.timer i { font-style: normal; font-size: .95cqw; margin-right: .7cqw; color: var(--dim); }
  .ov-rec .r .d.note { color: var(--dim); font-family: var(--sans); text-align: left; grid-column: 2 / 4; }
  .ov-hero .big.note { font-size: 2.2cqw; font-weight: 500; }
  .ov-card .bars { margin-top: 1.5cqw; display: grid; grid-template-columns: 8cqw 1fr; row-gap: .5cqw; align-items: center; font-family: var(--mono); font-size: .95cqw; color: var(--dim); }
  .ov-card .bar2 { display: flex; height: 1.5cqw; gap: 2px; }
  .ov-card .bar2 i { background: #f5f4ef; opacity: .85; min-width: 0; }
  .ov-card .bar2 i:nth-child(2n) { opacity: .5; }
  .ov-card .bar2 i.gap { background: none; border: 1px dashed rgba(245, 244, 239, .5); opacity: 1; }
  .ov-rec .ph { display: flex; justify-content: space-between; font-family: var(--mono); font-size: .95cqw; letter-spacing: .08em; color: var(--cy); padding: .35cqw 0 .45cqw; }
  .ov-intro .cols { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; column-gap: 3cqw; margin-top: 2.4cqw; }
  .ov-intro .cols h3 { margin: 0 0 .6cqw; font-family: var(--mono); font-weight: 400; font-size: 1.05cqw; letter-spacing: .08em; color: var(--cy); }
  .ov-intro .cols ol { margin: 0; max-width: none; }
  .ov-intro .cols li { grid-template-columns: 2.6cqw 1fr auto; font-size: 1.3cqw; padding: .5cqw 0; }
  .ov-intro .cols li .n { font-size: 1cqw; }
  .ov-intro .cols li .a { font-size: 1.15cqw; }
  .ov-intro .cols li .a.r { font-size: .85cqw; }
  .ov-card .find { font-size: 1.6cqw; margin: -.6cqw 0 1.4cqw; color: #f5f4ef; }
  .ov-card table.piv td, .ov-card table.piv th { padding-left: 1.2cqw; }
  .ov-card table.piv td:first-child { font-family: var(--mono); font-size: 1.6cqw; color: var(--cy); }
  .ov-card table.piv td small { color: var(--dim); font-size: .95cqw; margin-left: .3cqw; }
  .ov-card table.piv td.rs { color: #f5f4ef; font-size: 1.5cqw; }
  /* Chemistry asked for out loud: the molecules, the hypothesis, the amount of gas to expect. */
  .ov-chem { position: absolute; left: 2cqw; top: 7.5cqw; width: 44cqw; background: var(--scrim); border-radius: .5cqw; padding: 1.1cqw 1.5cqw 1.3cqw; }
  .ov-chem .k { font-family: var(--mono); font-size: 1cqw; letter-spacing: .06em; color: var(--dim); }
  .ov-chem h3 { margin: .2cqw 0 .6cqw; font-size: 1.9cqw; font-weight: 600; }
  .ov-chem svg { width: 100%; display: block; }
  .ov-chem .mol3d { position: relative; width: 100%; aspect-ratio: 560 / 250; }
  .ov-chem .mol3d canvas { position: absolute; inset: 0; width: 100% !important; height: 100% !important; }
  .ov-chem .mol3d span { position: absolute; transform: translate(-50%, -50%); font-family: var(--mono); font-size: 1.25cqw; white-space: nowrap; text-shadow: 0 0 .4cqw #141311; }
  .ov-chem .names { display: flex; justify-content: space-around; font-family: var(--mono); font-size: 1cqw; color: var(--dim); margin-top: .2cqw; }
  .ov-chem svg text { font-family: "IBM Plex Mono", ui-monospace, monospace; fill: #f5f4ef; }
  .ov-chem .scale { display: flex; align-items: center; gap: .8cqw; font-family: var(--mono); font-size: .9cqw; color: var(--dim); margin-top: .5cqw; }
  .ov-chem .scale i { flex: 1; height: .7cqw; border-radius: .35cqw; background: linear-gradient(90deg, #4f86e8, #c9ccd1, #e2513d); }
  .ov-chem .tiles { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1.4cqw; margin-top: .4cqw; }
  .ov-chem .tiles b { display: block; font-family: var(--mono); font-weight: 500; font-size: 1.9cqw; white-space: nowrap; }
  .ov-chem .tiles .big b { color: var(--cy); font-size: 2.8cqw; }
  .ov-chem .tiles span { font-size: 1.05cqw; color: var(--dim); }
  .ov-chem .cl { margin-top: .9cqw; font-size: 1.35cqw; }
  .ov-hero .why { font-size: 1.2cqw; margin-top: .55cqw; color: #f5f4ef; max-width: 40cqw; line-height: 1.3; }
  .ov-hero .why i { font-family: var(--mono); font-style: normal; font-size: .9cqw; color: var(--cy); margin-right: .7cqw; letter-spacing: .04em; }
  .ov-card .res { gap: 2.4cqw; }
  .ov-card .res b { white-space: nowrap; }
  .ov-card .res > div { max-width: 15cqw; }
  .ov-card .res .calc b { color: #f5f4ef; font-size: 2cqw; padding-top: .6cqw; }
  .ov-card .res .calc em { display: block; font-style: normal; font-family: var(--mono); font-size: .85cqw; color: var(--dim); }
  .ov-card .series { margin-top: 1.5cqw; }
  .ov-card .series .k { margin-bottom: .5cqw; }
  .ov-card .series tr.me td { color: var(--cy); }
  .ov-card .series td.diff { color: var(--amber); }
  .ov-hero.has-seen { display: grid; grid-template-columns: auto auto; column-gap: 1.4cqw; align-items: end; }
  .ov-seen { width: 17cqw; }
  .ov-seen img { width: 100%; display: block; border-radius: .3cqw; border: 1px solid rgba(245, 244, 239, .35); }
  .ov-seen .k { margin-top: .4cqw; }
  .ov-seen .k b { font-weight: 400; color: #6fdc6f; }
  .ov-seen .k b.no { color: var(--amber); }
  /* Opening cards (export): what the experiment is, then how it is done, before any footage. */
  .ov-intro { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: center; padding: 0 9cqw; }
  .ov-intro .eye { font-family: var(--mono); font-size: 1.15cqw; letter-spacing: .08em; color: var(--dim); }
  .ov-intro h1 { margin: 1cqw 0 0; font-size: 6.2cqw; font-weight: 600; letter-spacing: -.02em; line-height: 1.02; }
  .ov-intro .q { margin-top: 2cqw; font-size: 2.5cqw; line-height: 1.25; max-width: 62cqw; }
  .ov-intro .eq { margin-top: 3cqw; font-family: var(--mono); font-size: 1.9cqw; color: var(--cy); }
  .ov-intro .m { margin-top: 3cqw; font-size: 1.5cqw; color: var(--dim); }
  .ov-intro .m b { font-family: var(--mono); font-weight: 400; font-size: 1.05cqw; letter-spacing: .08em; margin-right: 1.2cqw; }
  .ov-intro.how h1 { font-size: 3.6cqw; }
  .ov-intro ol { list-style: none; margin: 2.4cqw 0 0; padding: 0; max-width: 70cqw; }
  .ov-intro li { display: grid; grid-template-columns: 5cqw 1fr auto; align-items: baseline; padding: .85cqw 0; border-top: 1px solid rgba(245, 244, 239, .18); font-size: 2cqw; }
  .ov-intro li .n { font-family: var(--mono); font-size: 1.5cqw; color: var(--cy); }
  .ov-intro li .a { font-family: var(--mono); font-size: 1.7cqw; }
  .ov-intro li .a.r { color: var(--dim); font-size: 1.2cqw; letter-spacing: .06em; }
  .ov-intro .rule { margin-top: 2.2cqw; font-size: 1.45cqw; color: var(--dim); max-width: 70cqw; }
  /* ---- Export (?overlay&export): only the overlay, on nothing, drawn for whatever moment server/glasses-export.ts asks for. ---- */
  html.export, body.export, body.export .screen { background: transparent !important; }
  body.export video { display: none; }
  body.export * { animation: none !important; }
  body.export .ov-rec .r.fresh { background: rgba(127, 214, 224, .28); box-shadow: 0 0 0 .5cqw rgba(127, 214, 224, .28); }
</style>
</head>
<body>
<header>
  <h1 id="title">Replay</h1>
  <span class="when" id="when"></span>
</header>
<main>
  <section class="stage">
    <div class="screen"><video id="video" playsinline preload="auto"></video><span class="tag">Glasses</span><div class="ov" id="ov"></div></div>
    <div class="bar">
      <button class="play" id="play" aria-label="Play">
        <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path id="playIcon" d="M4 2.5v11l9-5.5z" fill="currentColor"/></svg>
      </button>
      <span class="clock" id="clock">--:--:--</span>
      <div class="track" id="track" role="slider" aria-label="Time"><div class="head" id="head"></div></div>
    </div>
    <div class="key">
      <span><i class="tick camera"></i>Seen</span>
      <span><i class="tick voice"></i>Said</span>
      <span><i class="tick reply"></i>Answered</span>
      <span><i class="tick value"></i>Recorded</span>
    </div>

    // One call per moment: draw the overlay as it stood at `wall` (ms since 1970) and hand back what was drawn.
    window.cbx = { t0, tEnd, windows, cardAt, intros: introCards().length, intro(n) { $("ov").innerHTML = introCards()[n] ?? ""; return $("ov").innerHTML; }, parts: d.parts, title: d.context?.sop ?? "Recording", trial: d.context?.trial ?? "", derived: d.derived,
      async at(wall, skipMs, card, fast) { skipped = fast ? { until: Infinity, ms: 0, fast } : skipMs ? { until: Infinity, ms: skipMs } : null; forceCard = Boolean(card); lastOv = ""; drawOverlay(wall); await Promise.all([...$("ov").querySelectorAll("img")].map((i) => i.decode().catch(() => null))); return $("ov").innerHTML; } };
    return;
  }
  load(0);
}).catch(() => { feed.innerHTML = `<li class="empty">Couldn’t load this recording.</li>`; });
</script>
