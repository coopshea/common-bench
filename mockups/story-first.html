<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Common Bench, story first</title>
<style>
  :root {
    --paper: #efebe3; --card: #fff; --ink: #1b1a17; --ink-2: #5d5a52; --ink-3: #8f8b81; --line: #dcd6ca;
    --cooper: #2a78d6; --greeshma: #6250d6; --goal: #e6f2e2; --goal-ink: #2f7a2f; --amber: #b7791f; --amber-bg: #fbf1dc; --fail: #d03b3b;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); font: 15px/1.45 -apple-system, "Inter", system-ui, sans-serif; }
  button { font: inherit; cursor: pointer; }

  /* The mental model, always visible */
  .loop { display: flex; align-items: center; justify-content: center; gap: 10px; padding: 18px 16px 6px; flex-wrap: wrap; }
  .q { border: 1.5px solid var(--line); background: transparent; color: var(--ink-3); border-radius: 999px; padding: 6px 14px; font-weight: 600; font-size: 14px; }
  .q.on { border-color: var(--ink); background: var(--ink); color: #fff; }
  .q.done { color: var(--ink); border-color: var(--ink-3); }
  .arrow { color: var(--ink-3); }
  .back-arrow { color: var(--ink-3); font-size: 18px; }

  .stage { max-width: 860px; margin: 0 auto; padding: 18px 16px 120px; }
  h1 { font-size: 28px; letter-spacing: -0.02em; margin: 18px 0 6px; text-align: center; }
  .sub { color: var(--ink-2); text-align: center; margin: 0 auto 22px; max-width: 560px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 18px; box-shadow: 0 1px 2px rgba(0,0,0,0.04); }
  .row { display: flex; gap: 14px; align-items: stretch; justify-content: center; flex-wrap: wrap; }

  /* "More" buttons: hint at what's behind them */
  .more { display: inline-flex; align-items: center; gap: 6px; margin-top: 14px; border: 1px dashed var(--ink-3); background: transparent; color: var(--ink-2); border-radius: 8px; padding: 6px 12px; font-size: 13.5px; }
  .more:hover { border-style: solid; color: var(--ink); }
  .more::before { content: "+"; font-weight: 700; }
  .more[aria-expanded="true"]::before { content: "−"; }
  .reveal { margin-top: 10px; color: var(--ink-2); font-size: 14px; animation: in 0.3s ease-out both; }
  @keyframes in { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }

  /* Screen 0: notebooks */
  .nb { width: 240px; text-align: center; }
  .nb .who { font-weight: 700; }
  .nb .when { color: var(--ink-3); font-size: 13px; }
  .dots { margin-top: 10px; display: flex; justify-content: center; gap: 5px; flex-wrap: wrap; }
  .dots i { width: 10px; height: 10px; border-radius: 50%; display: block; }
  .gap { align-self: center; color: var(--ink-3); font-size: 13px; text-align: center; width: 110px; border-top: 1.5px dashed var(--line); padding-top: 6px; }
  .tacit { display: inline-block; margin-top: 10px; border: 1.5px dashed var(--greeshma); color: var(--greeshma); border-radius: 8px; padding: 2px 8px; font-size: 12.5px; }

  /* Screen 1: flow */
  .flow { display: grid; grid-template-columns: 1fr auto 1fr auto 1fr; align-items: center; gap: 10px; }
  .col { display: flex; flex-direction: column; gap: 8px; }
  .chip { border: 1.5px solid var(--ink); border-radius: 9px; background: #fff; padding: 6px 10px; font-size: 13.5px; text-align: center; }
  .chip.dashed { border-style: dashed; }
  .chip.dark { background: var(--ink); color: #fff; }
  .chip small { display: block; color: var(--ink-3); font-size: 11.5px; }
  .chip.dark small { color: rgba(255,255,255,0.65); }
  .flow .arr { color: var(--ink-3); font-size: 22px; }
  .lab { font-size: 12px; color: var(--ink-3); text-transform: uppercase; letter-spacing: 0.06em; text-align: center; }

  /* Screen 2: map */
  .map { display: block; margin: 0 auto; width: 100%; max-width: 640px; height: auto; }
  .pt { cursor: pointer; }
  .pt:hover circle.hit { fill: rgba(0,0,0,0.06); }
  .legend { display: flex; justify-content: center; gap: 16px; font-size: 13px; color: var(--ink-2); margin-top: 6px; flex-wrap: wrap; }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 5px; vertical-align: -1px; }

  /* Trial drawer */
  .drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(380px, 100vw); background: #fff; border-left: 1px solid var(--line); box-shadow: -10px 0 40px rgba(0,0,0,0.08); padding: 20px; overflow-y: auto; transform: translateX(100%); transition: transform 0.25s ease-out; z-index: 20; }
  .drawer.open { transform: none; }
  .drawer h2 { margin: 0 0 2px; font-size: 22px; }
  .drawer .x { position: absolute; top: 14px; right: 14px; border: 0; background: none; font-size: 18px; color: var(--ink-3); }
  .kv { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; font-size: 14px; margin: 12px 0; }
  .kv span:nth-child(odd) { color: var(--ink-2); }
  .ok { color: var(--goal-ink); font-weight: 600; } .bad { color: var(--fail); font-weight: 600; }
  .note { background: var(--paper); border-radius: 8px; padding: 8px 10px; font-size: 13.5px; color: var(--ink-2); }
  .h3 { font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--ink-3); margin-top: 16px; }

  /* Screen 3: diff */
  .diff { width: 100%; border-collapse: collapse; font-size: 14.5px; }
  .diff th { text-align: left; font-size: 13px; padding: 6px 10px; }
  .diff td { padding: 9px 10px; border-top: 1px solid var(--line); }
  .diff td:first-child { color: var(--ink-2); width: 30%; }
  .diff tr.accident td { background: var(--amber-bg); font-weight: 650; color: var(--ink); }
  .diff tr.accident td:first-child::after { content: " accidental"; color: var(--amber); font-size: 11.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; margin-left: 6px; }
  .diff tr.intended td:first-child::after { content: " on purpose"; color: var(--ink-3); font-size: 11.5px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; margin-left: 6px; }
  .diff tr.same td { color: var(--ink-3); }
  .callout { margin-top: 14px; border-left: 3px solid var(--goal-ink); padding: 6px 12px; background: var(--goal); border-radius: 0 8px 8px 0; font-size: 14px; }

  /* Screen 4: proposal */
  .arms { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 12px; }
  .arm { border: 1.5px dashed var(--ink-3); border-radius: 10px; padding: 12px; }
  .arm b { display: block; }
  .arm .est { color: var(--ink-3); font-size: 12.5px; margin-top: 6px; }
  .approve { margin-top: 14px; background: var(--ink); color: #fff; border: 0; border-radius: 9px; padding: 9px 18px; font-weight: 650; }
  .approve:disabled { background: var(--goal-ink); }
  .stamp { margin-left: 10px; color: var(--goal-ink); font-size: 14px; font-weight: 600; }

  /* Nav */
  .nav { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); display: flex; gap: 8px; align-items: center; background: var(--ink); color: #fff; padding: 8px 10px 8px 16px; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); z-index: 10; }
  .nav .n, .nav button { white-space: nowrap; }
  .nav .n { font-size: 12px; color: rgba(255,255,255,0.6); margin-right: 6px; }
  .nav button { border: 1px solid rgba(255,255,255,0.3); background: transparent; color: #fff; border-radius: 8px; padding: 5px 12px; }
  .nav button.primary { background: #fff; color: var(--ink); border-color: #fff; font-weight: 650; }
  .nav button:disabled { opacity: 0.35; cursor: default; }

  @media (max-width: 640px) {
    .flow { grid-template-columns: 1fr; } .flow .arr { transform: rotate(90deg); justify-self: center; }
    .arms { grid-template-columns: 1fr; } .gap { width: 100%; border-top: 0; }
  }
</style>
</head>
<body>

<nav class="loop" id="loop" aria-label="The three questions"></nav>
<main class="stage" id="stage"></main>
<aside class="drawer" id="drawer" aria-label="Trial"></aside>
<div class="nav"><span class="n" id="count"></span><button id="prev">Back</button><button class="primary" id="next">Next</button></div>

<script>
// Real numbers from app/data/notebook.json (seed 5). T15 estimates from the fitted surrogate.
const TRIALS = [
  ["T01","cooper","Oct 2024",15,0.6,0,0.4,2.60,44.8,70.5,0.27,91.9,"Baseline: 15% diluent. Strong, but 2.6 Pa·s is way over target."],
  ["T02","cooper","Oct 2024",18,0.7,0,0.5,2.39,47.6,78.2,0.46,91.1,"Diluent up to 18%. Still too thick."],
  ["T03","cooper","Nov 2024",20,0.8,0,0.4,2.23,48.7,76.7,0.51,92.2,"Small steps aren't getting there."],
  ["T04","cooper","Dec 2024",22,0.9,0,0.4,2.09,50.5,80.1,0.69,91.3,"Parts look good. Nothing close to 1.5 yet."],
  ["T05","cooper","Jan 2025",24,1.0,0,0.4,1.98,50.6,79.7,0.75,90.2,"Best so far, still over. Next: a big jump in diluent."],
  ["T06","cooper","Feb 2025",34,0.8,0,0.4,1.44,35.6,58.2,2.38,83.9,"Under target! But weak, and full of voids."],
  ["T07","cooper","Mar 2025",36,0.9,0,0.4,1.36,35.0,56.8,2.75,85.0,"Snapped clean. Porosity 2.75%."],
  ["T08","cooper","Apr 2025",38,1.0,0,0.4,1.30,34.4,53.7,3.74,87.2,"Brittle again. High diluent seems to make it porous and brittle."],
  ["T09","cooper","Apr 2025",38,1.0,0,18.2,1.28,44.2,67.9,0.38,83.0,"Replicate of T08, but it passed. \"Anomalous, likely a lucky specimen.\" Excluded."],
  ["T10","cooper","May 2025",40,1.2,0,0.4,1.19,30.7,49.2,5.22,75.5,"Didn't help. Calling high diluent a dead end."],
  ["T11","greeshma","Jul 2026",26,1.5,10,0.5,1.85,53.1,84.3,0.12,93.3,"First trial, from the SOP walkthrough. Everything passes."],
  ["T12","greeshma","Aug 2026",28,1.8,10,0.6,1.76,49.0,77.4,0.13,90.6,"All checks pass. 1.76 Pa·s."],
  ["T13","greeshma","Aug 2026",30,1.7,10,0.5,1.65,49.3,79.8,0.15,89.6,"Brittle fracture, but strength is fine."],
  ["T14","greeshma","Sep 2026",32,1.6,10,0.5,1.55,50.7,82.0,0.22,90.4,"Closest yet, still above 1.5. Might need DiluentX ($1,800, 6 weeks)?"],
].map(([id,who,date,dil,pi,degas,rest,v,uts,flex,por,via,note]) => ({id,who,date,dil,pi,degas,rest,v,uts,flex,por,via,note,
  excluded: id === "T09"}));
const EST = [
  { id: "T15a", label: "degassed", v: 1.29, uts: 47.8 },
  { id: "T15b", label: "not degassed (control)", v: 1.29, uts: 38.6 },
];
const CHECKS = [
  ["Doesn't snap when pulled", t => t.uts >= 40, t => `${t.uts} MPa`, "≥ 40"],
  ["Holds up to biting", t => t.flex >= 65, t => `${t.flex} MPa`, "≥ 65"],
  ["Few bubbles", t => t.por <= 1, t => `${t.por}%`, "≤ 1%"],
  ["Safe for cells", t => t.via >= 70, t => `${t.via}%`, "≥ 70%"],
];
const passAll = t => CHECKS.every(c => c[1](t));
const goal = t => t.v <= 1.5 && passAll(t);
const NAME = { cooper: "Cooper", greeshma: "Greeshma" };
const COLOR = { cooper: "var(--cooper)", greeshma: "var(--greeshma)" };

// The mental model: three questions in a loop. Screens 0–1 set it up; 2–4 walk it.
const QUESTIONS = ["What have we tried?", "How well did it work?", "What do we try next?"];
const SCREENS = [
  { q: null, render: problem },
  { q: null, render: changed },
  { q: 0, render: tried },
  { q: 1, render: differ },
  { q: 2, render: next },
];
let screen = 0, approved = false;

function renderLoop() {
  const cur = SCREENS[screen].q;
  document.getElementById("loop").innerHTML = QUESTIONS.map((q, i) =>
    `<button class="q ${cur === i ? "on" : cur !== null && i < cur ? "done" : ""}" data-go="${i + 2}">${q}</button>` +
    (i < 2 ? `<span class="arrow">→</span>` : `<span class="back-arrow" title="and back to the start">↺</span>`)).join("");
}

function go(n) {
  screen = Math.max(0, Math.min(SCREENS.length - 1, n));
  closeDrawer();
  renderLoop();
  const st = document.getElementById("stage");
  st.innerHTML = "";
  SCREENS[screen].render(st);
  document.getElementById("count").textContent = `${screen + 1} / ${SCREENS.length}`;
  document.getElementById("prev").disabled = screen === 0;
  document.getElementById("next").textContent = screen === SCREENS.length - 1 ? "Start over" : "Next";
  window.scrollTo(0, 0);
}

// "+" buttons: a hint of what's behind, and the detail only on request.
function more(label, html) {
  return `<button class="more" aria-expanded="false" onclick="toggleMore(this)">${label}</button><div class="reveal" hidden>${html}</div>`;
}
function toggleMore(b) {
  const open = b.getAttribute("aria-expanded") === "true";
  b.setAttribute("aria-expanded", String(!open));
  b.nextElementSibling.hidden = open;
}

// ---------- 1. The problem ----------
function problem(st) {
  const cooper = TRIALS.filter(t => t.who === "cooper"), g = TRIALS.filter(t => t.who === "greeshma");
  const dots = (ts, c) => `<div class="dots">${ts.map(() => `<i style="background:${c}"></i>`).join("")}</div>`;
  st.innerHTML = `
    <h1>Every experiment answers three questions</h1>
    <p class="sub">On a team, the answers live in different notebooks, kept by different people, years apart.</p>
    <div class="row">
      <div class="card nb"><div class="who" style="color:var(--cooper)">Cooper's notebook</div><div class="when">2024–25 · ${cooper.length} trials</div>${dots(cooper, "var(--cooper)")}</div>
      <div class="gap">never compared</div>
      <div class="card nb"><div class="who" style="color:var(--greeshma)">Greeshma's notebook</div><div class="when">2026 · ${g.length} trials</div>${dots(g, "var(--greeshma)")}
        <div class="tacit">degasses 10 min, out of habit</div></div>
    </div>
    <div style="text-align:center">${more("What gets lost between notebooks", `
      <ul style="text-align:left;max-width:520px;margin:6px auto">
        <li><b>Dead ends</b> nobody re-checks: Cooper gave up on high diluent.</li>
        <li><b>Outliers</b> thrown away: his one trial that passed was called "lucky".</li>
        <li><b>Habits</b> nobody writes down: Greeshma's degassing isn't in the SOP.</li>
      </ul>`)}</div>`;
}

// ---------- 2. What changed ----------
function changed(st) {
  const devices = ["Balance", "Mixer", "Viscometer", "Printer", "UV oven", "Test frame"];
  st.innerHTML = `
    <h1>Now the bench can keep the notebook</h1>
    <p class="sub">Machines log what they do. People log the steps machines can't see. It all lands in one place Claude can read.</p>
    <div class="card">
      <div class="flow">
        <div class="col"><div class="lab">Machines log themselves</div>${devices.map(d => `<div class="chip">${d}</div>`).join("")}
          <div class="lab" style="margin-top:6px">People log the rest</div><div class="chip dashed">Degas<small>no interface: logged by hand</small></div></div>
        <div class="arr">→</div>
        <div class="col"><div class="chip dark">One shared notebook<small>every trial, every step, every person</small></div></div>
        <div class="arr">→</div>
        <div class="col"><div class="chip dark">Claude<small>reads it, finds patterns, proposes the next trial</small></div></div>
      </div>
    </div>
    <div style="text-align:center">
      ${more("What is the Model Hardware Standard?", `Anthropic's research preview (Aug 2026): one standard driver so an AI agent can read from and operate lab devices, with each device's limits written down. Common Bench uses MHS-style logging built from the public description.`)}
      ${more("What MHS can't see", `Devices without a programmable interface, and anything a person does by hand. In this story, the decisive step (degassing) was one of them.`)}
    </div>`;
}

// ---------- 3. What have we tried? ----------
function tried(st) {
  st.innerHTML = `
    <h1>Everyone's trials, on one map</h1>
    <p class="sub">The goal is the green corner: thin enough to print fast, strong enough to use. Click any trial.</p>
    <div class="card">${mapSVG()}
      <div class="legend"><span><i style="background:var(--cooper)"></i>Cooper</span><span><i style="background:var(--greeshma)"></i>Greeshma</span><span>✕ fails a check</span>${approved ? `<span>◌ estimate</span>` : ""}</div>
    </div>
    <div style="text-align:center">${more("Every check, for every trial", checksTable())}</div>`;
  bindPoints(st);
}

function mapSVG() {
  const W = 640, H = 400, M = { l: 54, r: 18, t: 16, b: 46 };
  const x = v => M.l + (2.75 - v) / (2.75 - 0.95) * (W - M.l - M.r);   // thinner to the right
  const y = u => M.t + (56 - u) / (56 - 28) * (H - M.t - M.b);
  const gx = x(1.5), gy = y(40);
  const path = who => TRIALS.filter(t => t.who === who).map(t => `${x(t.v)},${y(t.uts)}`).join(" ");
  const pts = TRIALS.map(t => {
    const c = COLOR[t.who], X = x(t.v), Y = y(t.uts);
    const mark = passAll(t)
      ? `<circle cx="${X}" cy="${Y}" r="7" fill="${goal(t) ? c : "#fff"}" stroke="${c}" stroke-width="2.5"/>`
      : `<path d="M${X-6},${Y-6}L${X+6},${Y+6}M${X+6},${Y-6}L${X-6},${Y+6}" stroke="${c}" stroke-width="2.5"/>`;
    const label = t.id === "T09" ? `<text x="${X-12}" y="${Y+4}" text-anchor="end" font-size="12" fill="var(--ink-2)">T09 · thrown out</text>`
      : t.id === "T14" ? `<text x="${X}" y="${Y-14}" text-anchor="middle" font-size="12" fill="var(--ink-2)">T14 · her best</text>` : "";
    return `<g class="pt" data-id="${t.id}"><circle class="hit" cx="${X}" cy="${Y}" r="14" fill="transparent"/>${mark}${label}</g>`;
  }).join("");
  const est = approved ? EST.map(e => {
    const X = x(e.v), Y = y(e.uts);
    return `<circle cx="${X}" cy="${Y}" r="8" fill="none" stroke="var(--greeshma)" stroke-width="2" stroke-dasharray="3 3"/>
      <text x="${X-12}" y="${Y+4}" text-anchor="end" font-size="12" fill="var(--greeshma)">${e.id}</text>`;
  }).join("") : "";
  return `<svg class="map" viewBox="0 0 ${W} ${H}" role="img" aria-label="Viscosity against strength for every trial">
    <rect x="${gx}" y="${M.t}" width="${W - M.r - gx}" height="${gy - M.t}" fill="var(--goal)"/>
    <text x="${W - M.r - 8}" y="${M.t + 18}" text-anchor="end" font-size="13" font-weight="700" fill="var(--goal-ink)">Goal</text>
    <line x1="${gx}" x2="${gx}" y1="${M.t}" y2="${H - M.b}" stroke="var(--ink-3)" stroke-dasharray="4 4"/>
    <line x1="${M.l}" x2="${W - M.r}" y1="${gy}" y2="${gy}" stroke="var(--ink-3)" stroke-dasharray="4 4"/>
    <polyline points="${path("cooper")}" fill="none" stroke="var(--cooper)" stroke-opacity="0.35"/>
    <polyline points="${path("greeshma")}" fill="none" stroke="var(--greeshma)" stroke-opacity="0.35"/>
    <text x="${x(1.3)}" y="${y(29.2)}" text-anchor="middle" font-size="12" fill="var(--cooper)">his "dead end"</text>
    ${pts}${est}
    <text x="${(M.l + W - M.r) / 2}" y="${H - 10}" text-anchor="middle" font-size="12.5" fill="var(--ink-2)">thicker  ←  viscosity  →  thinner</text>
    <text transform="translate(16 ${(M.t + H - M.b) / 2}) rotate(-90)" text-anchor="middle" font-size="12.5" fill="var(--ink-2)">weaker  ←  strength  →  stronger</text>
  </svg>`;
}

function checksTable() {
  return `<table class="diff" style="margin-top:6px"><tr><th>Trial</th><th>Thin enough</th>${CHECKS.map(c => `<th>${c[0]}</th>`).join("")}</tr>
    ${TRIALS.map(t => `<tr><td style="color:${COLOR[t.who]};font-weight:600">${t.id}</td>
      <td class="${t.v <= 1.5 ? "ok" : "bad"}">${t.v.toFixed(2)}</td>
      ${CHECKS.map(c => `<td class="${c[1](t) ? "ok" : "bad"}">${c[2](t)}</td>`).join("")}</tr>`).join("")}</table>`;
}

function bindPoints(root) {
  root.querySelectorAll(".pt").forEach(g => g.addEventListener("click", () => openDrawer(g.dataset.id)));
}

function openDrawer(id) {
  const t = TRIALS.find(t => t.id === id);
  const d = document.getElementById("drawer");
  const status = goal(t) ? `<span class="ok">Goal met</span>` : passAll(t) ? `<span>Passes every check, still too thick</span>` : `<span class="bad">Fails ${CHECKS.filter(c => !c[1](t)).length} checks</span>`;
  d.innerHTML = `<button class="x" onclick="closeDrawer()" aria-label="Close">✕</button>
    <h2 style="color:${COLOR[t.who]}">${t.id}</h2><div style="color:var(--ink-3)">${NAME[t.who]} · ${t.date}${t.excluded ? " · excluded" : ""}</div>
    <div style="margin-top:8px">${status}</div>
    <div class="h3">Recipe</div>
    <div class="kv"><span>Diluent</span><span>${t.dil}%</span><span>Photoinitiator</span><span>${t.pi}%</span>
      <span>Degassed</span><span>${t.degas ? t.degas + " min" : "no"}</span><span>Rest before printing</span><span>${t.rest} h</span></div>
    <div class="h3">Results</div>
    <div class="kv"><span>Viscosity (goal ≤ 1.5)</span><span class="${t.v <= 1.5 ? "ok" : "bad"}">${t.v.toFixed(2)} Pa·s</span>
      ${CHECKS.map(c => `<span>${c[0]} (${c[3]})</span><span class="${c[1](t) ? "ok" : "bad"}">${c[2](t)}</span>`).join("")}</div>
    <div class="h3">Notes</div><div class="note">${t.note}</div>`;
  d.classList.add("open");
}
function closeDrawer() { document.getElementById("drawer").classList.remove("open"); }

// ---------- 4. How well did it work, and why? ----------
function differ(st) {
  const a = TRIALS.find(t => t.id === "T08"), b = TRIALS.find(t => t.id === "T14");
  const rows = [
    ["intended", "Diluent", `${a.dil}%`, `${b.dil}%`],
    ["intended", "Photoinitiator", `${a.pi}%`, `${b.pi}%`],
    ["same", "Weigh", "same", "same"],
    ["same", "Mix", "3000 rpm, 2 min", "3000 rpm, 2 min"],
    ["accident", "Degas", "none", "10 min"],
    ["same", "Print", "same", "same"],
    ["same", "Post-cure", "45 min", "45 min"],
  ];
  const tr = r => `<tr class="${r[0]}"><td>${r[1]}</td><td>${r[2]}</td><td>${r[3]}</td></tr>`;
  st.innerHTML = `
    <h1>Why did it work for her and not for him?</h1>
    <p class="sub">Claude lines up two runs step by step and separates what was changed on purpose from what differed by accident.</p>
    <div class="card">
      <table class="diff">
        <tr><th></th><th style="color:var(--cooper)">Cooper · T08 <span class="bad">✕</span></th><th style="color:var(--greeshma)">Greeshma · T14 <span class="ok">✓</span></th></tr>
        ${tr(rows[4])}
        <tbody id="allsteps" hidden>${rows.filter(r => r[0] !== "accident").map(tr).join("")}</tbody>
      </table>
      <button class="more" aria-expanded="false" onclick="toggleSteps(this)">Show all 7 steps</button>
      <div class="callout"><b>And T09 agrees.</b> Same recipe as T08, but it sat for 18 hours before printing, so the bubbles rose out. Porosity ${TRIALS[8].por}%, every check passed. It was thrown out as "lucky".</div>
    </div>
    <div style="text-align:center">${more("Why would bubbles matter?", `More diluent makes the resin thinner but the part more brittle. Brittle parts break at flaws, and bubbles are flaws. Without degassing, Cooper's high-diluent parts were weak because of bubbles, not because of the recipe.`)}</div>`;
}
function toggleSteps(b) {
  const body = document.getElementById("allsteps"), open = !body.hidden;
  body.hidden = open; b.setAttribute("aria-expanded", String(!open));
  b.textContent = open ? "Show all 7 steps" : "Hide the steps that match";
}

// ---------- 5. What do we try next? ----------
function next(st) {
  st.innerHTML = `
    <h1>The next trial, ready to approve</h1>
    <p class="sub">Claude drafts it. A person approves it. Nothing to order: an afternoon instead of a six-week, $1,800 wait.</p>
    <div class="card">
      <div style="font-weight:700">T15 · Does degassing fix Cooper's recipe?</div>
      <div style="color:var(--ink-2);font-size:14px">38% diluent, 1.7% photoinitiator. One change between the two arms.</div>
      <div class="arms">
        <div class="arm"><b>T15a · degassed 10 min</b>Should pass.<div class="est">estimate: ${EST[0].uts} MPa, under 1.5 Pa·s</div></div>
        <div class="arm"><b>T15b · not degassed</b>The control. Should fail like T08.<div class="est">estimate: ${EST[1].uts} MPa, under 1.5 Pa·s</div></div>
      </div>
      <button class="approve" id="approve" ${approved ? "disabled" : ""}>${approved ? "Approved" : "Approve as Greeshma"}</button>
      ${approved ? `<span class="stamp">Added to the map. Finding credited to Greeshma.</span>` : ""}
      ${approved ? `<div style="margin-top:14px">${mapSVG()}</div>` : ""}
    </div>
    <div style="text-align:center">
      ${more("Why run a control?", `If only T15a ran and passed, it could be the photoinitiator change. T15b changes nothing but the degassing, so the pair isolates the cause.`)}
      ${more("Where the estimates come from", `From a simple model fitted to the 14 trials, not from the language model, and always labeled as estimates.`)}
    </div>`;
  document.getElementById("approve").onclick = () => { approved = true; go(screen); };
  bindPoints(st);
}

document.getElementById("prev").onclick = () => go(screen - 1);
document.getElementById("next").onclick = () => go(screen === SCREENS.length - 1 ? 0 : screen + 1);
document.getElementById("loop").addEventListener("click", e => { const b = e.target.closest("[data-go]"); if (b) go(+b.dataset.go); });
document.addEventListener("keydown", e => {
  if (e.key === "Escape") closeDrawer();
  if (e.key === "ArrowRight") document.getElementById("next").click();
  if (e.key === "ArrowLeft" && screen > 0) go(screen - 1);
});
go(0);
</script>
</body>
</html>
